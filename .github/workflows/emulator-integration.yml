name: Firebase emulator integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INITIAL_ADMIN_EMAIL: harshd21507@gmail.com
      TENET_ENFORCE_APP_CHECK: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: emulator-debug-logs
          path: '*-debug.log'
          retention-days: 3
